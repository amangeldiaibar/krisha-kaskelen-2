<main class="wrap auth">
<h1>Создать аккаунт</h1>
<p class="meta">Чтобы подавать объявления, нужен аккаунт.</p>
<section class="panel">
<form class="stack" action="login.html">
<label>Имя и фамилия<input type="text" name="name" required autocomplete="name">
</label>
<label>Номер телефона<input type="tel" name="phone" placeholder="+7 700 000 00 00" required autocomplete="tel">
</label>
<label>Email<input type="email" name="email" required autocomplete="email">
</label>
<label>Пароль<input type="password" name="password" minlength="8" required autocomplete="new-password">
<span class="hint">Не менее 8 символов</span>
</label>
<label>Повторите пароль<input type="password" name="password2" minlength="8" required autocomplete="new-password">
</label>
<label class="check">
<input type="checkbox" required> Я согласен с условиями использования</label>
<button class="btn full" type="submit">Регистрация</button>
</form>
</section>
<p class="alt">Уже есть аккаунт? <a href="login.html">Войти</a>
</p>
</main>
<footer>
<div class="wrap">Krisha Kaskelen · Команда Jews · CSS 225 Web Development Project</div>
