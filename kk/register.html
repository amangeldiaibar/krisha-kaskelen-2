<main class="wrap auth">
<h1>Аккаунт жасау</h1>
<p class="meta">Хабарландыру беру үшін аккаунт керек.</p>
<section class="panel">
<form class="stack" action="login.html">
<label>Аты-жөні<input type="text" name="name" required autocomplete="name">
</label>
<label>Телефон нөмірі<input type="tel" name="phone" placeholder="+7 700 000 00 00" required autocomplete="tel">
</label>
<label>Email<input type="email" name="email" required autocomplete="email">
</label>
<label>Құпиясөз<input type="password" name="password" minlength="8" required autocomplete="new-password">
<span class="hint">Кемінде 8 таңба</span>
</label>
<label>Құпиясөзді қайталаңыз<input type="password" name="password2" minlength="8" required autocomplete="new-password">
</label>
<label class="check">
<input type="checkbox" required> Пайдалану шарттарымен келісемін</label>
<button class="btn full" type="submit">Тіркелу</button>
</form>
</section>
<p class="alt">Аккаунтыңыз бар ма? <a href="login.html">Кіру</a>
</p>
</main>
<footer>
<div class="wrap">Krisha Kaskelen · Jews командасы · CSS 225 Web Development Project</div>
</footer>
