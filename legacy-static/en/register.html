</span>
</div>
</header>
<main class="wrap auth">
<h1>Create an account</h1>
<p class="meta">You need an account to post apartments.</p>
<section class="panel">
<form class="stack" action="login.html">
<label>Full name<input type="text" name="name" required autocomplete="name">
</label>
<label>Phone number<input type="tel" name="phone" placeholder="+7 700 000 00 00" required autocomplete="tel">
</label>
<label>Email<input type="email" name="email" required autocomplete="email">
</label>
<label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password">
<span class="hint">At least 8 characters</span>
</label>
<label>Repeat password<input type="password" name="password2" minlength="8" required autocomplete="new-password">
</label>
<label class="check">
<input type="checkbox" required> I agree to the terms of use</label>
<button class="btn full" type="submit">Sign up</button>
</form>
</section>
<p class="alt">Already have an account? <a href="login.html">Log in</a>
</p>
</main>
<footer>
<div class="wrap">Krisha Kaskelen · Team Jews · CSS 225 Web Development Project</div>
</footer>
</body>
</html>
